name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  shellcheck:
    name: Shellcheck Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run shellcheck on all bash scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          severity: warning
          ignore_paths: '.git media'

  hadolint:
    name: Dockerfile Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Dockerfiles from templates
        run: |
          mkdir -p /tmp/test-repos
          for template in alpine debian python ubuntu ros ros2; do
            echo "Generating $template template..."
            bin/bbq-create --no-git "$template" "/tmp/test-repos/test-$template"
          done

      - name: Run Hadolint on generated Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: /tmp/test-repos/*/Dockerfile
          recursive: true
          failure-threshold: warning

  test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [shellcheck]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Run integration tests
        run: tests/test.sh --all --verbose
